name: App checks
on:
  push:
    paths: ['src/**', 'App.tsx', 'package*.json', 'app.json', 'tests/**', 'e2e/**', 'scripts/**', 'playwright.config.ts', '.github/workflows/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: 'true'
      EXPO_OFFLINE: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: python3 -m unittest discover -s tests -p release_android_test.py
      - run: python3 -m unittest discover -s tests -p native_acceptance_test.py
      - run: npm run typecheck
      - run: npm test -- --maxWorkers=2
      - run: npm run export:web -- --max-workers 2
      - run: npx playwright install --with-deps chromium
      - name: Browser regression
        run: npm run test:e2e -- --workers=1
      - name: Browser diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-regression-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
